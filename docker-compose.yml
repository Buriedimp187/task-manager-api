# Production stack: PostgreSQL, a one-shot migration, and the API.
#
#   docker compose -f docker-compose.yml up -d --build --wait
#
# Naming the file with -f skips docker-compose.override.yml, which holds the development conveniences (it is
# loaded automatically otherwise). See "Docker" in the README for the differences.
name: task-manager-api

x-hardened: &hardened
  read_only: true # nothing in the container needs to write to its own filesystem
  cap_drop: [ALL] # no Linux capabilities
  security_opt:
    - no-new-privileges:true
  pids_limit: 256

x-app-image: &app-image
  image: task-manager-api:latest
  build: .

services:
  db:
    # Pinned by digest (postgres:17); update it deliberately.
    image: postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    # No published ports: only the other services of this stack can reach the database.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID] # what PostgreSQL's entrypoint needs to own its data directory
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: [*hardened, *app-image]
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432" # the container-side port, whatever POSTGRES_PORT says in .env
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: [*hardened, *app-image]
    restart: unless-stopped
    stop_grace_period: 20s # uvicorn waits up to 15 s for in-flight requests
    # Optional settings (limits, TRUSTED_PROXIES, ...) are read from .env; the lines under `environment` win.
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      # Closed by default in production; set REGISTRATION_ENABLED=true in .env on purpose to open it.
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      # Loopback only: put a TLS-terminating reverse proxy in front of it to expose the API.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
